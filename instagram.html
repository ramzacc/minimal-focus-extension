<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Post - Minimal Focus Extension</title>
    <link rel="stylesheet" href="options.css">
    <style>
      body { max-width: 540px; margin: 16px auto; }
      #status { color: color-mix(in srgb, currentColor 55%, transparent); }
      #post[hidden] { display: none; }
      #post { display: block; width: 100%; height: 600px; border: 0; }
    </style>
    <script src="instagram.js" defer></script>
  </head>
  <body>
    <main>
      <p id="status" role="status">Loading post&hellip;</p>
      <iframe id="post" title="Instagram post" scrolling="no" hidden></iframe>
    </main>
  </body>
</html>
