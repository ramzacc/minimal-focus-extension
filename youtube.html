<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video - Minimal Focus Extension</title>
    <link rel="stylesheet" href="options.css">
    <style>
      body { max-width: 960px; margin: 24px auto; }
      #status { color: color-mix(in srgb, currentColor 55%, transparent); }
      #player[hidden] { display: none; }
      #player { position: relative; width: 100%; aspect-ratio: 16 / 9; }
      #player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 12px; }
    </style>
    <script src="youtube.js" defer></script>
  </head>
  <body>
    <main>
      <p id="status" role="status">Loading video&hellip;</p>
      <div id="player" hidden></div>
    </main>
  </body>
</html>
